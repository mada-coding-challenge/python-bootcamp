{% extends "base.html" %}

{% block title %}
Books
{% endblock %}

{% block content %}

<h1>Books</h1>

{% for book in books %}

    <h2>
        <a href="{% url 'book_detail' book.id %}">
            {{ book.title }}
        </a>
    </h2>

    <p>{{ book.author }}</p>

{% endfor %}

{% endblock %}
